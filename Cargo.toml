[package]
name = "forge-te"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
readme = "README.md"
description = "A lua-powered templating engine."
repository = "https://github.com/what386/forge"
keywords = ["templates", "lua", "scaffolding", "codegen"]
categories = ["command-line-utilities", "development-tools", "template-engine"]

[[bin]]
name = "forge"
path = "src/main.rs"

include = [
    "src/**/*.rs",
    "src/**/*.lua",
    "README.md",
    "LICENSE*",
]

exclude = [
    ".github",
    "scripts/",
    "completions/"
]

[features]
default = []
shell-completions = ["dep:clap_complete"]


[dependencies]
anyhow = "1.0.100"
mlua = { version = "0.10.2", features = ["lua54", "vendored"] }
regex = "1.11.1"
toml = "0.8.19"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
once_cell = "1.21.3"
clap = { version = "4.6.1", features = ["derive"] }
clap_complete = { version = "4.5.61", optional = true }

[dev-dependencies]
tempfile = "3.13.0"

