[package]
name = "forge"
version = "0.1.0"
edition = "2021"
# TODO: add metadata

exclude = [
    ".github",
    "scripts/",
    "completions/"
]

[features]
default = []
shell-completions = ["dep:clap_complete"]


[dependencies]
anyhow = "1.0.100"
mlua = { version = "0.11.6", features = ["lua54", "vendored"] }
regex = "1.11.1"
toml = "0.8.19"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
once_cell = "1.21.3"
clap = { version = "4.6.1", features = ["derive"] }
clap_complete = { version = "4.5.61", optional = true }

[dev-dependencies]
tempfile = "3.13.0"

