[package]
name = "forge-te"
version = "0.2.2"
edition = "2021"
license = "MIT OR Apache-2.0"
readme = "README.md"
description = "A lua-powered templating engine."
repository = "https://github.com/what386/forge"
keywords = ["templates", "lua", "scaffolding", "codegen"]
categories = ["command-line-utilities", "development-tools", "template-engine"]
include = [
    "src/**/*.rs",
    "src/**/*.lua",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
]

[[bin]]
name = "forge"
path = "src/main.rs"

[features]
default = []
shell-completions = ["dep:clap_complete"]


[dependencies]
anyhow = "1.0.100"
mlua = { version = "0.11.6", features = ["lua54", "vendored"] }
regex = "1.11.1"
toml = "1.1.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.11.0"
once_cell = "1.21.3"
clap = { version = "4.6.1", features = ["derive"] }
clap_complete = { version = "4.5.61", optional = true }
tempfile = "3.13.0"
time = { version = "0.3.37", features = ["formatting"] }

[dev-dependencies]

[[bin]]
name = "completions"
path = "src/completions.rs"
required-features = ["shell-completions"]
