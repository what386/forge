[package]
name = "forge-te"
version = "0.2.3"
edition = "2021"
license = "MIT OR Apache-2.0"
readme = "README.md"
description = "A lua-powered templating engine."
repository = "https://github.com/what386/forge"
keywords = ["templates", "lua", "scaffolding", "codegen"]
categories = ["command-line-utilities", "development-tools", "template-engine"]
include = [
    "/src/**/*.rs",
    "/src/**/*.lua",
    "/tests/**/*.rs",
    "/build.rs",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
]

[[bin]]
name = "forge"
path = "src/main.rs"

[features]
default = []
shell-completions = ["dep:clap_complete"]


[dependencies]
anyhow = "1.0.102"
mlua = { version = "0.11.6", features = ["lua54", "vendored"] }
regex = "1.12.4"
toml = "1.1.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.11.0"
once_cell = "1.21.4"
clap = { version = "4.6.1", features = ["derive"] }
clap_complete = { version = "4.6.5", optional = true }
tempfile = "3.27.0"
time = { version = "0.3.49", features = ["formatting"] }

[dev-dependencies]

[[bin]]
name = "completions"
path = "src/completions.rs"
required-features = ["shell-completions"]
